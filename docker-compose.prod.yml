name: enterprise-knowledge-platform

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
  DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL must be set}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND must be set}
  CELERY_SOFT_TIME_LIMIT_SECONDS: ${CELERY_SOFT_TIME_LIMIT_SECONDS:-600}
  CELERY_TIME_LIMIT_SECONDS: ${CELERY_TIME_LIMIT_SECONDS:-660}
  CELERY_MAX_RETRIES: ${CELERY_MAX_RETRIES:-3}
  STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
  STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY must be set}
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY must be set}
  STORAGE_BUCKET: ${STORAGE_BUCKET:-documents}
  STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
  STORAGE_CONNECT_TIMEOUT_SECONDS: ${STORAGE_CONNECT_TIMEOUT_SECONDS:-5}
  STORAGE_READ_TIMEOUT_SECONDS: ${STORAGE_READ_TIMEOUT_SECONDS:-30}
  STORAGE_ORPHAN_GRACE_SECONDS: ${STORAGE_ORPHAN_GRACE_SECONDS:-900}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-document_chunks_openai_1536}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
  OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
  OPENAI_RETRY_BACKOFF_SECONDS: ${OPENAI_RETRY_BACKOFF_SECONDS:-0.5}
  QUERY_UNDERSTANDING_ENABLED: ${QUERY_UNDERSTANDING_ENABLED:-true}
  QUERY_UNDERSTANDING_MAX_TOKENS: ${QUERY_UNDERSTANDING_MAX_TOKENS:-200}
  ANSWER_EVALUATION_ENABLED: ${ANSWER_EVALUATION_ENABLED:-true}
  ANSWER_EVALUATION_MAX_ATTEMPTS: ${ANSWER_EVALUATION_MAX_ATTEMPTS:-2}
  ANSWER_EVALUATION_MIN_SCORE: ${ANSWER_EVALUATION_MIN_SCORE:-0.75}
  QUESTION_CACHE_ENABLED: ${QUESTION_CACHE_ENABLED:-true}
  QUESTION_CACHE_REDIS_URL: ${QUESTION_CACHE_REDIS_URL:?QUESTION_CACHE_REDIS_URL must be set}
  QUESTION_CACHE_TTL_SECONDS: ${QUESTION_CACHE_TTL_SECONDS:-86400}
  QUESTION_CACHE_SIMILARITY_THRESHOLD: ${QUESTION_CACHE_SIMILARITY_THRESHOLD:-0.94}
  QUESTION_CACHE_MAX_CANDIDATES: ${QUESTION_CACHE_MAX_CANDIDATES:-50}
  QUESTION_CACHE_LOCK_SECONDS: ${QUESTION_CACHE_LOCK_SECONDS:-45}
  REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-0.5}
  REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-1}
  REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-100}
  REDIS_POOL_TIMEOUT_SECONDS: ${REDIS_POOL_TIMEOUT_SECONDS:-2}
  CELERY_BROKER_POOL_LIMIT: ${CELERY_BROKER_POOL_LIMIT:-20}
  QUERY_CONCURRENCY_LIMIT: ${QUERY_CONCURRENCY_LIMIT:-100}
  QUERY_CONCURRENCY_WAIT_SECONDS: ${QUERY_CONCURRENCY_WAIT_SECONDS:-10}
  QUERY_CONCURRENCY_DISTRIBUTED_ENABLED: ${QUERY_CONCURRENCY_DISTRIBUTED_ENABLED:-true}
  QUERY_CONCURRENCY_REDIS_URL: ${QUERY_CONCURRENCY_REDIS_URL:?QUERY_CONCURRENCY_REDIS_URL must be set}
  QUERY_CONCURRENCY_LEASE_SECONDS: ${QUERY_CONCURRENCY_LEASE_SECONDS:-120}
  CHUNK_SIZE: ${CHUNK_SIZE:-800}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-120}
  SEMANTIC_CHUNKING_ENABLED: ${SEMANTIC_CHUNKING_ENABLED:-true}
  SEMANTIC_CHUNK_SIMILARITY_THRESHOLD: ${SEMANTIC_CHUNK_SIMILARITY_THRESHOLD:-0.78}
  SEMANTIC_CHUNK_MIN_SIZE: ${SEMANTIC_CHUNK_MIN_SIZE:-200}
  VECTOR_CANDIDATE_K: ${VECTOR_CANDIDATE_K:-20}
  BM25_CANDIDATE_K: ${BM25_CANDIDATE_K:-20}
  RRF_K: ${RRF_K:-60}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-cross_encoder}
  RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
  RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-}
  RERANKER_DEVICE: ${RERANKER_DEVICE:-auto}
  RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
  RERANKER_MAX_TEXT_CHARS: ${RERANKER_MAX_TEXT_CHARS:-4000}
  RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-16}
  RERANKER_MAX_CONCURRENCY: ${RERANKER_MAX_CONCURRENCY:-2}
  RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-10}
  RERANKER_FALLBACK_PROVIDER: ${RERANKER_FALLBACK_PROVIDER:-lexical}
  RERANKER_CANDIDATE_K: ${RERANKER_CANDIDATE_K:-20}
  MIN_RETRIEVAL_SCORE: ${MIN_RETRIEVAL_SCORE:-0.05}
  PROCESSING_STALE_AFTER_SECONDS: ${PROCESSING_STALE_AFTER_SECONDS:-900}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  AUTH_REQUIRED: "true"
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY must be set}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant_data:/qdrant/storage

  migrate:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${WEB_CONCURRENCY:-2}"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - model_cache:/home/appuser/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["sh", "-c", "celery -A app.worker.celery_app:celery_app worker --loglevel=INFO --concurrency=$${CELERY_WORKER_CONCURRENCY:-2}"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - model_cache:/home/appuser/.cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started

  beat:
    extends:
      service: worker
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--loglevel=INFO"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  model_cache:
