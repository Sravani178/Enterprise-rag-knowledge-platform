services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
      DB_POOL_TIMEOUT_SECONDS: 30
      DB_POOL_RECYCLE_SECONDS: 1800
      CORS_ORIGINS: http://localhost:5173
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_SOFT_TIME_LIMIT_SECONDS: 600
      CELERY_TIME_LIMIT_SECONDS: 660
      CELERY_MAX_RETRIES: 3
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: documents
      STORAGE_CONNECT_TIMEOUT_SECONDS: 5
      STORAGE_READ_TIMEOUT_SECONDS: 30
      STORAGE_ORPHAN_GRACE_SECONDS: 900
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: document_chunks_openai_1536
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSION: 1536
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MAX_RETRIES: 2
      OPENAI_RETRY_BACKOFF_SECONDS: 0.5
      QUERY_UNDERSTANDING_ENABLED: "true"
      QUERY_UNDERSTANDING_MAX_TOKENS: 200
      ANSWER_EVALUATION_ENABLED: "true"
      ANSWER_EVALUATION_MAX_ATTEMPTS: 2
      ANSWER_EVALUATION_MIN_SCORE: 0.75
      QUESTION_CACHE_ENABLED: "true"
      QUESTION_CACHE_REDIS_URL: redis://redis:6379/2
      QUESTION_CACHE_TTL_SECONDS: 86400
      QUESTION_CACHE_SIMILARITY_THRESHOLD: 0.94
      QUESTION_CACHE_MAX_CANDIDATES: 50
      QUESTION_CACHE_LOCK_SECONDS: 45
      REDIS_CONNECT_TIMEOUT_SECONDS: 0.5
      REDIS_SOCKET_TIMEOUT_SECONDS: 1
      REDIS_MAX_CONNECTIONS: 100
      REDIS_POOL_TIMEOUT_SECONDS: 2
      CELERY_BROKER_POOL_LIMIT: 20
      QUERY_CONCURRENCY_LIMIT: 100
      QUERY_CONCURRENCY_WAIT_SECONDS: 10
      QUERY_CONCURRENCY_DISTRIBUTED_ENABLED: "true"
      QUERY_CONCURRENCY_REDIS_URL: redis://redis:6379/3
      QUERY_CONCURRENCY_LEASE_SECONDS: 120
      CHUNK_SIZE: 800
      CHUNK_OVERLAP: 120
      SEMANTIC_CHUNKING_ENABLED: "true"
      SEMANTIC_CHUNK_SIMILARITY_THRESHOLD: 0.78
      SEMANTIC_CHUNK_MIN_SIZE: 200
      VECTOR_CANDIDATE_K: 20
      BM25_CANDIDATE_K: 20
      RRF_K: 60
      RERANKER_PROVIDER: cross_encoder
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-auto}
      RERANKER_MAX_LENGTH: 512
      RERANKER_MAX_TEXT_CHARS: 4000
      RERANKER_BATCH_SIZE: 16
      RERANKER_MAX_CONCURRENCY: 2
      RERANKER_TIMEOUT_SECONDS: 10
      RERANKER_FALLBACK_PROVIDER: lexical
      RERANKER_CANDIDATE_K: 20
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      PROCESSING_STALE_AFTER_SECONDS: 900
      AUTH_REQUIRED: "false"
      JWT_SECRET: development-only-change-this-secret
      RATE_LIMIT_ENABLED: "false"
      RATE_LIMIT_PER_MINUTE: 60
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
      DB_POOL_TIMEOUT_SECONDS: 30
      DB_POOL_RECYCLE_SECONDS: 1800
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_SOFT_TIME_LIMIT_SECONDS: 600
      CELERY_TIME_LIMIT_SECONDS: 660
      CELERY_MAX_RETRIES: 3
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: documents
      STORAGE_CONNECT_TIMEOUT_SECONDS: 5
      STORAGE_READ_TIMEOUT_SECONDS: 30
      STORAGE_ORPHAN_GRACE_SECONDS: 900
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: document_chunks_openai_1536
      EMBEDDING_PROVIDER: openai
      EMBEDDING_MODEL: text-embedding-3-small
      EMBEDDING_DIMENSION: 1536
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MAX_RETRIES: 2
      OPENAI_RETRY_BACKOFF_SECONDS: 0.5
      QUERY_UNDERSTANDING_ENABLED: "true"
      QUERY_UNDERSTANDING_MAX_TOKENS: 200
      ANSWER_EVALUATION_ENABLED: "true"
      ANSWER_EVALUATION_MAX_ATTEMPTS: 2
      ANSWER_EVALUATION_MIN_SCORE: 0.75
      QUESTION_CACHE_ENABLED: "true"
      QUESTION_CACHE_REDIS_URL: redis://redis:6379/2
      QUESTION_CACHE_TTL_SECONDS: 86400
      QUESTION_CACHE_SIMILARITY_THRESHOLD: 0.94
      QUESTION_CACHE_MAX_CANDIDATES: 50
      QUESTION_CACHE_LOCK_SECONDS: 45
      REDIS_CONNECT_TIMEOUT_SECONDS: 0.5
      REDIS_SOCKET_TIMEOUT_SECONDS: 1
      REDIS_MAX_CONNECTIONS: 100
      REDIS_POOL_TIMEOUT_SECONDS: 2
      CELERY_BROKER_POOL_LIMIT: 20
      QUERY_CONCURRENCY_LIMIT: 100
      QUERY_CONCURRENCY_WAIT_SECONDS: 10
      QUERY_CONCURRENCY_DISTRIBUTED_ENABLED: "true"
      QUERY_CONCURRENCY_REDIS_URL: redis://redis:6379/3
      QUERY_CONCURRENCY_LEASE_SECONDS: 120
      CHUNK_SIZE: 800
      CHUNK_OVERLAP: 120
      SEMANTIC_CHUNKING_ENABLED: "true"
      SEMANTIC_CHUNK_SIMILARITY_THRESHOLD: 0.78
      SEMANTIC_CHUNK_MIN_SIZE: 200
      VECTOR_CANDIDATE_K: 20
      BM25_CANDIDATE_K: 20
      RRF_K: 60
      RERANKER_PROVIDER: cross_encoder
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-auto}
      RERANKER_MAX_LENGTH: 512
      RERANKER_MAX_TEXT_CHARS: 4000
      RERANKER_BATCH_SIZE: 16
      RERANKER_MAX_CONCURRENCY: 2
      RERANKER_TIMEOUT_SECONDS: 10
      RERANKER_FALLBACK_PROVIDER: lexical
      RERANKER_CANDIDATE_K: 20
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      PROCESSING_STALE_AFTER_SECONDS: 900
      AUTH_REQUIRED: "false"
      JWT_SECRET: development-only-change-this-secret
      RATE_LIMIT_ENABLED: "false"
      RATE_LIMIT_PER_MINUTE: 60
    volumes:
      - ./backend/app:/app/app
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started

  beat:
    extends:
      service: worker
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=INFO

volumes:
  postgres_data:
  frontend_node_modules:
  minio_data:
  qdrant_data:
